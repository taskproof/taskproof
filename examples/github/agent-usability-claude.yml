# taskproof — agent-usability check on every PR (Claude computer-use lane).
#
# Copy this file into `.github/workflows/` in YOUR repo. It runs your task specs through
# Claude on each pull request, diffs the result against a committed baseline, and posts a
# sticky PR comment. By default it does NOT block the merge — the comment is the signal.
#
# One-time setup in your repo:
#   1. `taskproof init --url https://your-site.com`  → writes specs to taskproof/tasks/
#   2. On your default branch, capture a baseline and commit it:
#        taskproof run taskproof/tasks/*.yaml --models claude-opus-4-8 --out taskproof-runs
#        taskproof baseline save --to taskproof/baseline.json
#        git add taskproof/ && git commit -m "taskproof: baseline"
#   3. Add an `ANTHROPIC_API_KEY` repository secret.
#
# Pre-release note: taskproof isn't on npm yet, so this builds it from source. Once it ships,
# delete the "Build taskproof from source" block and set `taskproof: npx taskproof@latest`.

name: agent-usability
on:
  pull_request:
    # Optional: only run when the site or the specs change.
    # paths: ['src/**', 'taskproof/**']

# One run per PR; cancel a superseded run so comments don't race.
concurrency:
  group: agent-usability-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write # required to post the sticky comment

jobs:
  agent-usability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # your repo (specs + committed baseline)

      # ---- Build taskproof from source (delete once it's published) -------------------
      - uses: actions/checkout@v4
        with:
          repository: taskproof/taskproof # ← the repo that hosts taskproof
          path: .taskproof-src
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: .taskproof-src/package.json # use taskproof's pinned pnpm
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: .taskproof-src/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: .taskproof-src
      - run: pnpm build
        working-directory: .taskproof-src
      - run: pnpm --filter @taskproof/adapter-claude exec playwright install --with-deps chromium
        working-directory: .taskproof-src
      # ---------------------------------------------------------------------------------

      # Cheap per-PR lane: one pass per task (-k 1) with a hard budget cap.
      - name: Run agents
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: >-
          node .taskproof-src/packages/cli/dist/index.js run taskproof/tasks/*.yaml
          --models claude-opus-4-8 -k 1 --max-cost 1.00 --out taskproof-runs

      # Diff against the committed baseline and post / update the sticky PR comment.
      - uses: taskproof/taskproof/.github/actions/taskproof-comment@main # ← same repo, pin a tag in prod
        with:
          taskproof: node .taskproof-src/packages/cli/dist/index.js
          run-dir: taskproof-runs
          baseline: taskproof/baseline.json
          fail-on-regression: 'false' # set 'true' to block merges on a regression
